<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PyaarPremaKaadhal — Mobile Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-primary: #ff3b75;
      --pink-soft: #fff0f4;
      --pink-border: #ffc2d4;
      --text-dark: #1f0f15;
      --text-muted: #85616e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0508;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Full Screen Mobile Container */
    .app-viewport {
      width: 100%;
      max-width: 430px;
      height: 100%;
      max-height: 932px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.7);
    }

    @media (min-width: 481px) {
      .app-viewport {
        height: 92vh;
        border-radius: 44px;
        border: 8px solid #1f0f15;
      }
    }

    /* Screen Image Viewport */
    .screen-area {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    .prototype-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      opacity: 0;
      transform: scale(0.97);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }

    .prototype-screen.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    /* Bottom Navigation Bar */
    .nav-bar {
      height: 72px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--pink-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
      z-index: 100;
    }

    .nav-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 0;
      transition: all 0.2s ease;
    }

    .nav-tab.active {
      color: var(--pink-primary);
      font-weight: 800;
    }

    .nav-icon {
      font-size: 22px;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .nav-tab.active .nav-icon {
      transform: translateY(-2px) scale(1.2);
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <!-- Active Mobile Screen Display -->
    <div class="screen-area" id="screenArea">
      <img src="docs/assets/ai_discovery.png" id="screen-discovery" class="prototype-screen active" alt="AI Discovery Screen">
      <img src="docs/assets/compatibility_match.png" id="screen-match" class="prototype-screen" alt="Compatibility Match Screen">
      <img src="docs/assets/tap_to_connect.png" id="screen-tap" class="prototype-screen" alt="Tap-to-Connect Screen">
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
      <button class="nav-tab active" onclick="switchTab('screen-discovery', this)">
        <span class="nav-icon">🤖</span>
        <span>AI Discovery</span>
      </button>
      <button class="nav-tab" onclick="switchTab('screen-match', this)">
        <span class="nav-icon">💖</span>
        <span>Match Engine</span>
      </button>
      <button class="nav-tab" onclick="switchTab('screen-tap', this)">
        <span class="nav-icon">⚡</span>
        <span>Tap Connect</span>
      </button>
    </div>
  </div>

  <script>
    function switchTab(screenId, tabBtn) {
      document.querySelectorAll('.prototype-screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));

      document.getElementById(screenId).classList.add('active');
      tabBtn.classList.add('active');
    }

    // Touch Swipe navigation support
    let startX = 0;
    let endX = 0;
    const screens = ['screen-discovery', 'screen-match', 'screen-tap'];
    let idx = 0;

    const area = document.getElementById('screenArea');
    area.addEventListener('touchstart', e => { startX = e.changedTouches[0].screenX; });
    area.addEventListener('touchend', e => {
      endX = e.changedTouches[0].screenX;
      if (endX < startX - 40 && idx < screens.length - 1) idx++;
      else if (endX > startX + 40 && idx > 0) idx--;
      const tabs = document.querySelectorAll('.nav-tab');
      switchTab(screens[idx], tabs[idx]);
    });
  </script>
</body>
</html>
